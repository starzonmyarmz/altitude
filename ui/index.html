  :root {
    --night: #0f3b3e;
    --night-deep: #082628;
    --ink: #2a160e;
    --cream: #fff3dc;
    --tomato: #e2483b;
    --tomato-deep: #8f2219;
    --mustard: #f2c230;
    --mustard-deep: #a8700f;
    --mint: #6fd3b0;
    --mint-deep: #2f8a6c;
    --wood: #5a3420;
    --wood-deep: #2e170b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    block-size: 100%;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }

  body {
    display: grid;
    place-items: center;
    background: var(--night-deep);
    color: var(--cream);
    font-family: -apple-system, "Segoe UI", sans-serif;
  }

  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
  }

  :focus-visible {
    outline: 3px solid var(--cream);
    outline-offset: 3px;
  }

  .scene {
    position: relative;
    display: grid;
    grid-template-columns: 300px 1fr;
    inline-size: 600px;
    block-size: 720px;
    padding: 24px 20px 20px;
    background:
      radial-gradient(circle at 50% 0%, #1d5a5c, transparent 70%),
      repeating-linear-gradient(90deg, transparent 0 46px, #0000001a 46px 48px),
      var(--night);
  }

  .label {
    font-family: "Chango", sans-serif;
    font-size: 13px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--cream);
    text-shadow: 0 2px 0 var(--ink);
  }

  .readout {
    position: absolute;
    z-index: 2;
    padding: 3px 7px;
    border-radius: 6px;
    background: var(--ink);
    color: var(--cream);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 120ms;
  }

  :is(.floor, .control):is(:hover, .active, :focus-within) .readout { opacity: 1; }

  /* ---------- the pole ---------- */

  .pole {
    position: relative;
    display: grid;
    align-content: start;
    justify-items: center;

    &::before {
      content: "";
      position: absolute;
      inset-block: 20px 0;
      inset-inline: 112px;
      border-radius: 8px;
      background: linear-gradient(90deg, var(--wood) 0 60%, var(--wood-deep));
    }
  }

  .floor {
    --level: 0;
    --open: calc(0.14 + var(--level) * 0.86);
    position: relative;
    display: grid;
    grid-template-columns: 210px 70px;
    align-items: center;
    block-size: 124px;

    & .face {
      display: block;
      inline-size: 210px;
      block-size: 124px;
      overflow: visible;
      rotate: var(--tilt);
      touch-action: none;
      cursor: ns-resize;
      outline: 0;
    }

    & .face:focus-visible .block { stroke: var(--cream); }

    & .tag {
      display: grid;
      justify-items: center;
      gap: 6px;
    }

    & .readout {
      inset-inline-start: 50%;
      inset-block-start: 4px;
      translate: -50% 0;
    }
  }

  .face {
    & .shadow { fill: var(--ink); }
    & .block { stroke: var(--ink); stroke-width: 5; }
    & .line { fill: none; stroke: var(--ink); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    & .ink { fill: var(--ink); }
    & .cream { fill: var(--cream); stroke: var(--ink); stroke-width: 4; }
    & .accent { stroke: var(--ink); stroke-width: 4; }

    & .mouth {
      transform-box: fill-box;
      transform-origin: center;
      scale: 1 var(--open);
      transition: scale 90ms;
    }

    & .shut { display: none; }
  }

  [data-family="up"] .face { & .block { fill: var(--mustard); } & .accent { fill: var(--tomato); } }
  [data-family="dry"] .face { & .block { fill: var(--mint); } & .accent { fill: var(--mustard); } }
  [data-family="down"] .face { & .block { fill: var(--tomato); } & .accent { fill: var(--mustard); } }

  .floor[data-on="false"], .scene[data-stomp="off"] .floor:not([data-floor="you"]) {
    --open: 0.06;

    & .face .open { display: none; }
    & .face .shut { display: inline; }
    & .face { filter: saturate(0.35) brightness(0.8); }
  }

  .peg {
    position: relative;
    inline-size: 30px;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 3px solid var(--ink);
    background: radial-gradient(circle at 35% 30%, #fff8, transparent 45%), var(--wood);
    box-shadow: 0 4px 0 var(--ink);
    cursor: pointer;
    transition: translate 60ms, box-shadow 60ms, background-color 120ms;

    &[aria-pressed="true"] {
      background-color: var(--cream);
      background: radial-gradient(circle at 35% 30%, #fff, transparent 45%), var(--cream);
    }

    &:active {
      translate: 0 3px;
      box-shadow: 0 1px 0 var(--ink);
    }
  }

  .base {
    position: relative;
    inline-size: 150px;
    block-size: 26px;
    margin-inline-end: 70px;
    border: 4px solid var(--ink);
    border-radius: 10px 10px 4px 4px;
    background: linear-gradient(var(--wood), var(--wood-deep));
  }

  /* ---------- the board ---------- */

  .board {
    display: grid;
    grid-template-rows: auto 1fr auto;
    justify-items: center;
    padding-block-start: 6px;
  }

  .badge {
    display: grid;
    place-items: center;
    inline-size: 230px;
    block-size: 92px;
    border-radius: 22px;
    rotate: -2deg;
    background: linear-gradient(var(--mustard), #d99a1c);
    box-shadow: inset 0 3px 0 #ffe28a, inset 0 -6px 0 var(--mustard-deep), 0 8px 0 #5a3a14, 0 14px 20px #0008;

    & span {
      font-family: "Chango", sans-serif;
      font-size: 42px;
      letter-spacing: -0.03em;
      line-height: 1;
      padding-block-start: 0.08em;
      color: var(--tomato);
      text-shadow: 0 3px 0 var(--tomato-deep), 0 -1px 0 #ff9b8a;
      -webkit-text-stroke: 2px #3a1d12;
      paint-order: stroke fill;
    }
  }

  .knobs {
    display: grid;
    align-content: center;
    justify-items: center;
    gap: 22px;
  }

  .control {
    position: relative;
    display: grid;
    justify-items: center;
    gap: 8px;

    & .readout {
      inset-inline-start: calc(100% + 10px);
      inset-block-start: 26px;
    }
  }

  .knob {
    --size: 74px;
    position: relative;
    inline-size: var(--size);
    aspect-ratio: 1;
    touch-action: none;
    cursor: ns-resize;
    outline: 0;

    &:focus-visible .cap { outline: 3px solid var(--cream); outline-offset: 4px; }

    & .skirt {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--ink);
      translate: 0 5px;
    }

    & .cap {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 4px solid var(--ink);
      background:
        radial-gradient(circle at 35% 30%, #fff9, transparent 40%),
        repeating-conic-gradient(var(--cream) 0 12deg, #f1e1c2 12deg 24deg);
    }

    & .pointer {
      position: absolute;
      inset: 0;
      rotate: calc(var(--turn) * 270deg - 135deg);
      pointer-events: none;

      &::before {
        content: "";
        position: absolute;
        inset-inline-start: calc(50% - 5px);
        inset-block-start: 7px;
        inline-size: 10px;
        block-size: 24px;
        border-radius: 5px;
        border: 3px solid var(--ink);
        background: var(--tomato);
      }
    }
  }

  .stomp-box {
    display: grid;
    justify-items: center;
    gap: 8px;
  }

  .lamp {
    inline-size: 22px;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 3px solid var(--ink);
    background: #5a4a2a;
    transition: background 160ms, box-shadow 160ms;
  }

  .stomp {
    inline-size: 84px;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 5px solid var(--ink);
    background: radial-gradient(circle at 35% 30%, #ff9b8a, transparent 45%), var(--tomato);
    box-shadow: 0 8px 0 var(--ink);
    cursor: pointer;
    transition: translate 60ms, box-shadow 60ms;

    &:active {
      translate: 0 5px;
      box-shadow: 0 3px 0 var(--ink);
    }
  }

  .scene[data-stomp="on"] .lamp {
    background: var(--mustard);
    box-shadow: 0 0 6px 2px #f2c230cc, 0 0 22px 6px #f2c23066;
  }
</style>
</head>

  const dragging = new Set();
  const scene = document.querySelector(".scene");

  const bridge = window.ipc
    ? (msg) => window.ipc.postMessage(JSON.stringify(msg))
    : mockBridge();

  function setParam(id, value) {
    const p = params.get(id);
    if (!p) return;
    p.value = Math.min(1, Math.max(0, value));
    bridge({ type: "set", id, value: p.value });
    views.get(id)?.(p);
  }

  function gesture(id, fn) {
    bridge({ type: "begin", id });
    fn();
    bridge({ type: "end", id });
  }

  // ---------- controls ----------

  // Drag up or down (Shift for fine moves), scroll, arrow keys, and
  // double-click to reset.
  function slider(el, host, p) {
    const id = p.id;
    el.tabIndex = 0;
    el.setAttribute("role", "slider");
    el.setAttribute("aria-label", p.name);
    el.setAttribute("aria-valuemin", "0");
    el.setAttribute("aria-valuemax", "1");

    el.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      el.setPointerCapture(e.pointerId);
      el.focus();
      dragging.add(id);
      host.classList.add("active");
      bridge({ type: "begin", id });
      let lastY = e.clientY;
      const move = (ev) => {
        const fine = ev.shiftKey ? 0.15 : 1;
        setParam(id, p.value + ((lastY - ev.clientY) / 200) * fine);
        lastY = ev.clientY;
      };
      const up = () => {
        el.removeEventListener("pointermove", move);
        el.removeEventListener("pointerup", up);
        el.removeEventListener("pointercancel", up);
        dragging.delete(id);
        host.classList.remove("active");
        bridge({ type: "end", id });
      };
      el.addEventListener("pointermove", move);
      el.addEventListener("pointerup", up);
      el.addEventListener("pointercancel", up);
    });

    el.addEventListener("dblclick", () => gesture(id, () => setParam(id, p.default)));

    el.addEventListener("keydown", (e) => {
      const dir = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
      if (dir === undefined) return;
      e.preventDefault();
      e.stopPropagation();
      gesture(id, () => setParam(id, p.value + dir * (e.shiftKey ? 0.1 : 0.01)));
    });

    el.addEventListener("wheel", (e) => {
      e.preventDefault();
      const dir = Math.sign(-e.deltaY);
      if (!dir) return;
      gesture(id, () => setParam(id, p.value + dir * 0.005));
    }, { passive: false });

    return (p) => {
      el.setAttribute("aria-valuenow", p.value.toFixed(4));
      el.setAttribute("aria-valuetext", p.text);
    };
  }

  function buildFloor(host) {
    const level = params.get(host.dataset.floor);
    const on = params.get(`${host.dataset.floor}_on`);
    if (!level || !on) return;

    const face = host.querySelector(".face");
    const peg = host.querySelector(".peg");
    const readout = host.querySelector(".readout");
    host.querySelector(".label").textContent = level.name;
    peg.setAttribute("aria-label", on.name);

    const aria = slider(face, host, level);
    views.set(level.id, (p) => {
      aria(p);
      host.style.setProperty("--level", p.value.toFixed(4));
      readout.textContent = p.text;
    });
    views.set(on.id, (p) => {
      const lit = p.value >= 0.5;
      host.dataset.on = String(lit);
      peg.setAttribute("aria-pressed", String(lit));
    });
    peg.addEventListener("click", () => gesture(on.id, () => setParam(on.id, on.value >= 0.5 ? 0 : 1)));
  }

  function buildKnob(host) {
    const p = params.get(host.dataset.knob);
    if (!p) return;

    const knob = document.createElement("div");
    knob.className = "knob";
    for (const part of ["skirt", "cap", "pointer"]) {
      const el = document.createElement("div");
      el.className = part;
      knob.append(el);
    }
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = p.name;
    const readout = document.createElement("span");
    readout.className = "readout";
    host.replaceChildren(knob, label, readout);

    const aria = slider(knob, host, p);
    views.set(p.id, (p) => {
      aria(p);
      knob.style.setProperty("--turn", p.value.toFixed(4));
      readout.textContent = p.text;
    });
  }

  function buildStomp(host) {
    const p = params.get(host.dataset.stompSwitch);
    if (!p) return;

    const lamp = document.createElement("span");
    lamp.className = "lamp";
    const button = document.createElement("button");
    button.className = "stomp";
    button.setAttribute("aria-label", p.name);
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = p.name;
    host.replaceChildren(lamp, button, label);

    views.set(p.id, (p) => {
      const lit = p.value >= 0.5;
      button.setAttribute("aria-pressed", String(lit));
      scene.dataset.stomp = lit ? "on" : "off";
    });
    button.addEventListener("click", () => gesture(p.id, () => setParam(p.id, p.value >= 0.5 ? 0 : 1)));
  }

  function build() {
    document.querySelectorAll("[data-floor]").forEach(buildFloor);
    document.querySelectorAll("[data-knob]").forEach(buildKnob);
    document.querySelectorAll("[data-stomp-switch]").forEach(buildStomp);
    for (const p of params.values()) views.get(p.id)?.(p);
  }

  // ---------- messages ----------

  addEventListener("pointerdown", () => bridge({ type: "focus" }), true);
  addEventListener("focusin", () => bridge({ type: "keys", active: true }));
  addEventListener("focusout", (e) => {
    if (!e.relatedTarget) bridge({ type: "keys", active: false });
  });

  function forwardKey(msg) {
    const { event, type, ...init } = msg;
    const target = document.activeElement ?? document.body;
    target.dispatchEvent(new KeyboardEvent(event, { ...init, bubbles: true, cancelable: true }));
  }

  window.onPluginMessage = (msg) => {
    switch (msg.type) {
      case "key": return forwardKey(msg);
      case "init":
        params.clear();
        msg.params.forEach((p) => params.set(p.id, { ...p, value: p.default, text: "" }));
        build();
        return;
      case "values":
        for (const { id, value, text } of msg.values) {
          const p = params.get(id);
          if (!p) continue;
          p.text = text;
          if (!dragging.has(id)) p.value = value;
          views.get(id)?.(p);
        }
        return;
    }
  };

  // ---------- browser mock ----------

  // Mirrors the plugin's parameters so the page can be worked on in a
  // browser. Keep it in step with params when they change.
  function mockBridge() {
    const percent = (n) => `${Math.round(n * 100)}%`;
    const onOff = (n) => (n >= 0.5 ? "On" : "Off");
    const specs = [
      { id: "mole", name: "Mole", steps: 0, default: 0, text: percent },
      { id: "bear", name: "Bear", steps: 0, default: 0.5, text: percent },
      { id: "you", name: "You", steps: 0, default: 1, text: percent },
      { id: "fox", name: "Fox", steps: 0, default: 0, text: percent },
      { id: "owl", name: "Owl", steps: 0, default: 0, text: percent },
      { id: "shade", name: "Shade", steps: 0, default: 0.6, text: percent },
      { id: "wake", name: "Wake", steps: 0, default: 0, text: (n) => `${Math.round(n * 1000)} ms` },
      { id: "sway", name: "Sway", steps: 0, default: 0, text: (n) => `${(n * 25).toFixed(1)} cents` },
      { id: "mole_on", name: "Mole on", steps: 1, default: 1, text: onOff },
      { id: "bear_on", name: "Bear on", steps: 1, default: 1, text: onOff },
      { id: "you_on", name: "You on", steps: 1, default: 1, text: onOff },
      { id: "fox_on", name: "Fox on", steps: 1, default: 1, text: onOff },
      { id: "owl_on", name: "Owl on", steps: 1, default: 1, text: onOff },
      { id: "stomp", name: "Stomp", steps: 1, default: 1, text: onOff },
    ];
    const values = Object.fromEntries(specs.map((s) => [s.id, s.default]));
    const send = (msg) => setTimeout(() => window.onPluginMessage(msg));
    const sendValues = (ids) => send({
      type: "values",
      values: ids.map((id) => ({ id, value: values[id], text: specs.find((s) => s.id === id).text(values[id]) })),
    });
    return (msg) => {
      switch (msg.type) {
        case "ready":
          send({ type: "init", params: specs.map(({ text, ...rest }) => ({ options: [], ...rest })) });
          sendValues(specs.map((s) => s.id));
          return;
        case "set":
          values[msg.id] = msg.value;
          sendValues([msg.id]);
          return;
      }
    };
  }

  bridge({ type: "ready" });
})();
</script>
</body>
</html>
